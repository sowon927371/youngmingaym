    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body {
            font-family: 'Jua', sans-serif;
            background-color: #121212;
            color: #ffffff;
            user-select: none;
            overflow-x: hidden;
        }

        /* 7x7 Cage Container */
        .cage-board {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(7, 1fr);
        }

        /* Realistic Step-by-Step Walking Animation */
        #characterElem, .senior-elem {
            position: absolute;
            width: 14.285%;  /* 1/7 size of board */
            height: 14.285%;
            transition: top 0.35s ease-out, left 0.35s ease-out, transform 0.3s ease;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Walking Wobble Animation */
        .is-walking {
            animation: walkWobble 0.35s infinite ease-in-out;
        }

        @keyframes walkWobble {
            0% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-3px) rotate(-4deg); }
            75% { transform: translateY(-3px) rotate(4deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Sleeping / Lying Down State */
        .is-lying {
            transform: rotate(-90deg) scale(0.95) translateY(5px) !important;
            transition: transform 0.5s ease;
        }

        /* Poop Positioning */
        .poop-item {
            position: absolute;
            width: 14.285%;
            height: 14.285%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* Floating speech bubble animation - FAST (1.8s) */
        @keyframes floatUpAndFade {
            0% {
                opacity: 0;
                transform: translate(-50%, 5px) scale(0.8);
            }
            15% {
                opacity: 1;
                transform: translate(-50%, -10px) scale(1);
            }
            70% {
                opacity: 1;
                transform: translate(-50%, -30px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -45px) scale(0.8);
            }
        }

        .speech-bubble-anim {
            animation: floatUpAndFade 1.8s ease-in-out forwards;
        }

        /* Smoke FX for Smoking */
        @keyframes smokeRise {
            0% { opacity: 0.8; transform: translate(-50%, 0) scale(0.5); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(1.8); }
        }

        .smoke-particle {
            position: absolute;
            top: 0;
            left: 50%;
            width: 24px;
            height: 24px;
            background: rgba(220, 220, 220, 0.6);
            border-radius: 50%;
            filter: blur(4px);
            pointer-events: none;
            z-index: 30;
            animation: smokeRise 1.5s ease-out forwards;
        }

        .modal-bg {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
        }
    </style>
</head>

    <script>

            // ==========================================
        // Web Audio API 기반 효과음 & BGM 엔진
        // ==========================================
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(freq, type, duration, gainVal = 0.1) {
            if (AudioCtx.state === 'suspended') AudioCtx.resume();
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            
            osc.type = type; // 'sine', 'square', 'sawtooth', 'triangle'
            osc.frequency.setValueAtTime(freq, AudioCtx.currentTime);
            
            gain.gain.setValueAtTime(gainVal, AudioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, AudioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(AudioCtx.destination);
            
            osc.start();
            osc.stop(AudioCtx.currentTime + duration);
        }

        // 🔊 상황별 효과음 함수 모음
        const SFX = {
            // 걷기 (터벅터벅)
            walk: () => playTone(120, 'triangle', 0.08, 0.05),
            
            // 쌈배 (휘이잉~)
            smoke: () => {
                playTone(400, 'sine', 0.3, 0.03);
                setTimeout(() => playTone(250, 'sine', 0.5, 0.02), 200);
            },
            
            // 알몸 뛰기 (호루라기 경보)
            siren: () => {
                playTone(800, 'sawtooth', 0.15, 0.1);
                setTimeout(() => playTone(600, 'sawtooth', 0.15, 0.1), 150);
                setTimeout(() => playTone(900, 'sawtooth', 0.2, 0.12), 300);
            },
            
            // 3연딸 / 커비 (뿅/삐이-)
            powerUp: () => {
                playTone(300, 'square', 0.1, 0.08);
                setTimeout(() => playTone(500, 'square', 0.1, 0.08), 100);
                setTimeout(() => playTone(800, 'square', 0.25, 0.1), 200);
            },
            
            // 관등성명 / 군가 (나팔 뼝뼝)
            trumpet: () => {
                playTone(392, 'sawtooth', 0.15, 0.08); // Sol
                setTimeout(() => playTone(523, 'sawtooth', 0.15, 0.08), 150); // Do
                setTimeout(() => playTone(659, 'sawtooth', 0.3, 0.1), 300); // Mi
            },
            
            // 똥싸기 (뿌직)
            poop: () => playTone(80, 'sawtooth', 0.25, 0.15)
        };

        // 🎵 8비트 군가풍 레트로 BGM 루프
        let bgmInterval = null;
        function startBGM() {
            if (bgmInterval) return;
            const melody = [261, 293, 329, 349, 392, 392, 392, 0, 392, 349, 329, 293, 261, 261, 261, 0];
            let step = 0;
            
            bgmInterval = setInterval(() => {
                const note = melody[step % melody.length];
                if (note > 0) {
                    playTone(note, 'triangle', 0.18, 0.03);
                }
                step++;
            }, 220);
        }

        const shimYoungDataUrl = "심영.png";

        let charData = {
            name: "이영민",
            military: "army",
            batch: "1234기",
            rank: "일병",
            isGay: "YES",
            customFaceUrl: null
        };

        let currentPos = { r: 4, c: 3 };
        let charElem = null;
        let isPerformingAction = false;
        let noticeTimeout = null;

        const normalDialogues = [
            "심심하당...",
            "흠ㄴㅑ링..~",
            "담배마렵노",
            "시발섹스하고싶다",
            "좆같네 ㅅㅂ럼들;;",
            "항@문",
            "찌@찌",
            "응어아잇푸르rr",
            "L을 가져가~",
            "승제야 사랑해!!!"
        ];

        const poopDialogues = ["뿌직!", "뿡!", "푸드덕!!!", "영민이 똥따떠여"];

        function selectMilitary(type) {
            charData.military = type;
            document.querySelectorAll('.mil-btn').forEach(btn => btn.classList.replace('border-green-500', 'border-transparent'));
            if (type === 'army') document.getElementById('btnArmy').classList.replace('border-transparent', 'border-green-500');
            if (type === 'navy') document.getElementById('btnNavy').classList.replace('border-transparent', 'border-green-500');
            if (type === 'airforce') document.getElementById('btnAirforce').classList.replace('border-transparent', 'border-green-500');
        }

        function startGame() {
            const nameVal = document.getElementById('inputName').value.trim();
            if (nameVal) charData.name = nameVal;
            charData.batch = document.getElementById('inputBatch').value.trim();
            charData.rank = document.getElementById('inputRank').value;
            const gayRadio = document.querySelector('input[name="isGay"]:checked');
            if (gayRadio) charData.isGay = gayRadio.value;

            document.getElementById('displayName').innerText = charData.name;
            document.getElementById('displayBatch').innerText = `(${charData.batch})`;
            document.getElementById('displayRank').innerText = charData.rank;
            document.getElementById('categoryPlayName').innerText = `${charData.name}아 노올자`;

            if (charData.isGay === 'YES') {
                document.getElementById('displayGay').classList.remove('hidden');
            }

            document.getElementById('loginLayer').classList.add('hidden');

            createCharacterElement();
            updateCharacterPosition();
            startLoop();

            startBGM();
        }

        function createCharacterElement() {
            const board = document.getElementById('cageBoard');
            charElem = document.createElement('div');
            charElem.id = 'characterElem';
            
            renderCharacterSVG();
            board.appendChild(charElem);
        }

        function renderCharacterSVG() {
            let camoPattern = '#2d5a27'; // Army
            let hatOrBird = '';

            if (charData.military === 'navy') {
                camoPattern = '#1e3a8a';
                hatOrBird = `<path d="M 12 9 Q 20 2 28 9 Z" fill="#dc2626" />`;
            } else if (charData.military === 'airforce') {
                camoPattern = '#0284c7';
                hatOrBird = `<text x="27" y="24" font-size="10">🦜</text>`;
            }

            let faceContent = `<circle cx="20" cy="12" r="7" fill="#d97706" />
                               <circle cx="18" cy="11" r="1" fill="#000" />
                               <circle cx="22" cy="11" r="1" fill="#000" />
                               <path d="M 18 14 Q 20 16 22 14" stroke="#000" stroke-width="0.8" fill="none" />`;

            if (charData.customFaceUrl) {
                faceContent = `<image href="${charData.customFaceUrl}" x="10" y="3" width="20" height="20" preserveAspectRatio="xMidYMid slice" />`;
            }

            charElem.innerHTML = `
                <div class="relative w-full h-full flex flex-col items-center justify-center p-1" id="charInner">
                    <svg viewBox="0 0 40 50" class="w-full h-full drop-shadow-md">
                        <circle cx="7" cy="28" r="2.5" fill="#d97706" />
                        <circle cx="33" cy="28" r="2.5" fill="#d97706" />
                        <ellipse cx="14" cy="46" rx="3" ry="2" fill="#d97706" />
                        <ellipse cx="26" cy="46" rx="3" ry="2" fill="#d97706" />

                        <rect x="12" y="32" width="5" height="13" rx="2" fill="${camoPattern}" />
                        <rect x="23" y="32" width="5" height="13" rx="2" fill="${camoPattern}" />
                        <rect x="11" y="19" width="18" height="15" rx="3" fill="#ffffff" />
                        <rect x="11" y="19" width="18" height="15" rx="3" fill="${camoPattern}" opacity="0.85" />
                        <rect x="7" y="20" width="4" height="10" rx="2" fill="${camoPattern}" />
                        <rect x="29" y="20" width="4" height="10" rx="2" fill="${camoPattern}" />

                        <circle cx="20" cy="12" r="8" fill="#d97706" />
                        ${faceContent}
                        ${hatOrBird}
                    </svg>
                </div>
            `;
        }

        function updateCharacterPosition() {
            if (!charElem) return;
            
            SFX.walk();
            charElem.classList.add('is-walking');
            charElem.style.top = `${currentPos.r * 14.285}%`;
            charElem.style.left = `${currentPos.c * 14.285}%`;

            setTimeout(() => {
                if (charElem) charElem.classList.remove('is-walking');
            }, 350);
        }

        function handleFaceUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;

                    ctx.drawImage(img, 0, 0);
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;

                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];

                        if (g > 100 && r < 120 && b < 120 && g > r * 1.2 && g > b * 1.2) {
                            data[i + 3] = 0;
                        }
                    }

                    ctx.putImageData(imgData, 0, 0);
                    charData.customFaceUrl = canvas.toDataURL();
                    renderCharacterSVG();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function startLoop() {
            setInterval(() => {
                if (isPerformingAction) return;

                const moves = [
                    { r: -1, c: 0 }, { r: 1, c: 0 },
                    { r: 0, c: -1 }, { r: 0, c: 1 }
                ];
                const randMove = moves[Math.floor(Math.random() * moves.length)];
                
                currentPos.r = Math.max(2, Math.min(6, currentPos.r + randMove.r));
                currentPos.c = Math.max(0, Math.min(6, currentPos.c + randMove.c));

                updateCharacterPosition();
            }, 2500);

            setInterval(() => {
                if (isPerformingAction) return;
                const text = normalDialogues[Math.floor(Math.random() * normalDialogues.length)];
                showSpeechBubble(text);
            }, 5000);

            setInterval(() => {
                spawnPoop();
            }, 180000);
        }

        function showSpeechBubble(text, targetElem = charElem) {
            if (!targetElem) return;

            const bubble = document.createElement('div');
            bubble.className = 'absolute -top-7 left-1/2 -translate-x-1/2 bg-white text-black text-xs font-bold px-2 py-1 rounded-lg border border-black shadow-lg z-30 whitespace-nowrap pointer-events-none speech-bubble-anim';
            bubble.innerText = text;

            targetElem.appendChild(bubble);

            setTimeout(() => {
                bubble.remove();
            }, 1800);
        }

        function spawnPoop() {
            SFX.poop();
            const r = Math.floor(Math.random() * 5) + 2; 
            const c = Math.floor(Math.random() * 7);

            const poopId = `poop-${Date.now()}`;
            const board = document.getElementById('cageBoard');

            const poopElem = document.createElement('div');
            poopElem.id = poopId;
            poopElem.className = 'poop-item text-2xl cursor-pointer hover:scale-125 transition transform';
            poopElem.style.top = `${r * 14.285}%`;
            poopElem.style.left = `${c * 14.285}%`;
            poopElem.innerText = '💩';
            poopElem.onclick = () => cleanPoop(poopId);

            board.appendChild(poopElem);

            const poopText = poopDialogues[Math.floor(Math.random() * poopDialogues.length)];
            showSpeechBubble(poopText);
        }

        function cleanPoop(poopId) {
            const poopElem = document.getElementById(poopId);
            if (!poopElem) return;

            poopElem.innerText = '🧹쓱싹...';
            poopElem.className = 'poop-item text-xs bg-yellow-300 text-black font-bold rounded animate-pulse z-20';

            setTimeout(() => {
                poopElem.remove();
            }, 1000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.replace('bg-green-700', 'bg-gray-700'));
            document.querySelectorAll('[id^="content"]').forEach(c => c.classList.add('hidden'));

            if (tab === 'play') {
                document.getElementById('tabPlay').classList.replace('bg-gray-700', 'bg-green-700');
                document.getElementById('contentPlay').classList.remove('hidden');
            } else if (tab === 'talent') {
                document.getElementById('tabTalent').classList.replace('bg-gray-700', 'bg-green-700');
                document.getElementById('contentTalent').classList.remove('hidden');
            } else if (tab === 'duty') {
                document.getElementById('tabDuty').classList.replace('bg-gray-700', 'bg-green-700');
                document.getElementById('contentDuty').classList.remove('hidden');
            }
        }

        function updateNoticeText(text, duration = 3000) {
            const notice = document.getElementById('actionNotice');
            const noticeText = document.getElementById('actionText');

            if (noticeTimeout) clearTimeout(noticeTimeout);

            noticeText.innerText = text;
            notice.classList.remove('opacity-0');

            noticeTimeout = setTimeout(() => {
                notice.classList.add('opacity-0');
            }, duration);
        }

        // ==========================================
        // 액션 및 연출 로직 (개선된 알몸 뛰기 및 선임 스폰)
        // ==========================================
        function doAction(actionType) {
            isPerformingAction = true;

            if (actionType === 'ssambae') {
                SFX.smoke();
                updateNoticeText("🚬 (후우...) 씁-하~ 씨@발 이게 쎽@쓰지");
                showSpeechBubble("ㅎ기모찌이");

                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const smoke = document.createElement('div');
                        smoke.className = 'smoke-particle';
                        charElem.appendChild(smoke);
                        setTimeout(() => smoke.remove(), 1500);
                    }, i * 400);
                }

                setTimeout(() => { isPerformingAction = false; }, 2000);

            } else if (actionType === 'catchball') {

                SFX.walk();
                setTimeout(() => SFX.walk(), 200);
                setTimeout(() => SFX.walk(), 400);

                updateNoticeText("⚾ 주고받는 던지기! 나이스 캐치!");
                showSpeechBubble("캐치캐치 딴따란딴딴!");

                charElem.style.transform = 'translateY(-15px)';
                setTimeout(() => { charElem.style.transform = 'translateY(0px)'; }, 200);
                setTimeout(() => { charElem.style.transform = 'translateY(-15px)'; }, 400);
                setTimeout(() => { 
                    charElem.style.transform = 'translateY(0px)';
                    isPerformingAction = false; 
                }, 600);

            } else if (actionType === 'ggul') {
                SFX.smoke();
                updateNoticeText("📱 관물대에 누워서 인스타 릴스 보는 중... 기모찌~");
                showSpeechBubble("ㅈ뻉이쳐라 땅개들아");

                currentPos = { r: 3, c: 4 };
                updateCharacterPosition();

                setTimeout(() => {
                    charElem.classList.add('is-lying');
                }, 400);

                setTimeout(() => {
                    charElem.classList.remove('is-lying');
                    isPerformingAction = false;
                }, 3000);

            } else if (actionType === 'goonga') {
                SFX.trumpet();
                let song = "육군가: 사나이로 태어나서~ ♬";
                if (charData.military === 'navy') song = "해군가: 바다로 나가자 푸른 바다로~ ♬";
                if (charData.military === 'airforce') song = "공군가: 하늘을 가르는 높푸른 기상~ ♬";
                updateNoticeText(`🎺 ${song}`);
                showSpeechBubble("우렁찬 군가 제창!!");
                setTimeout(() => { isPerformingAction = false; }, 2000);

            } else if (actionType === 'nakedRun') {
                const isCaught = Math.random() < 0.2; // 20% 확률로 발각
                
                SFX.walk();
                setTimeout(() => SFX.walk(), 100);
                setTimeout(() => SFX.walk(), 200);
                setTimeout(() => SFX.walk(), 300);

                // 질주 시작
                updateNoticeText("🏃‍♂️💨 알몸으로 신나게 뛰어댕기는 중!!!");
                showSpeechBubble("야호~ 시원하다!");

                currentPos = { r: 5, c: 0 };
                updateCharacterPosition();

                setTimeout(() => {
                    currentPos = { r: 5, c: 6 };
                    updateCharacterPosition();
                }, 350);

                setTimeout(() => {
                    currentPos = { r: 4, c: 3 };
                    updateCharacterPosition();

                    if (isCaught) {
                        let seniorTitle = "선임";
                        if (charData.military === 'navy') seniorTitle = "함장";
                        if (charData.military === 'airforce') seniorTitle = "전대장";

                        SFX.siren();
                        updateNoticeText(`🚨 [발각!!] 야 이 개짬찌새끼야 뭐하냐?? (${seniorTitle}님 등판!!)`, 4000);
                        showSpeechBubble("앗.. 선임한테 걸렸다 좆됐다!!");

                        // 선임 캐릭터 스폰 연출
                        spawnSeniorCharacter(seniorTitle);
                    } else {
                        updateNoticeText("🏃‍♂️💨 알몸으로 자유롭게 쾌속 질주 완료!! (안 걸림)", 3000);
                        showSpeechBubble("ㅋㅋㅋ 안 걸렸다 꿀잼!");
                        isPerformingAction = false;
                    }
                }, 750);

            } else if (actionType === 'samYeonDdal') {
                SFX.powerUp();
                updateNoticeText("하아아아아앙 기모찌!!@@");
                showSpeechBubble("하으으읏 기모찌!!@@");
                
                document.getElementById('shimYoungImg').src = shimYoungDataUrl;
                document.getElementById('shimYoungOverlay').classList.remove('opacity-0');
                setTimeout(() => {
                    document.getElementById('shimYoungOverlay').classList.add('opacity-0');
                    isPerformingAction = false;
                }, 2200);

            } else if (actionType === 'kirby') {
                SFX.powerUp();
                updateNoticeText("😮‍💨 (꺼어어어억~~) 별의 커비!!!");
                showSpeechBubble("후우우아아아압!!!!!!!");

                charElem.style.transform = 'scale(1.3)';
                setTimeout(() => {
                    charElem.style.transform = 'scale(1.0)';
                    isPerformingAction = false;
                }, 800);

            } else if (actionType === 'salute') {
                SFX.trumpet();
                let saluteText = "충성!";
                if (charData.military === 'navy' || charData.military === 'airforce') saluteText = "필승!";
                updateNoticeText(`🫡 ${saluteText}! ${charData.rank} ${charData.name}!`);
                showSpeechBubble(`${saluteText}! ${charData.rank} ${charData.name}!`);
                setTimeout(() => { isPerformingAction = false; }, 2000);

            } else if (actionType === 'ddalmong') {
                SFX.smoke();
                updateNoticeText("Tip! 몽정빤쓰는 딸몽과 교환할 수 있다!");
                showSpeechBubble("아잉 부끄러");
                setTimeout(() => { isPerformingAction = false; }, 2000);
            }
        }

        // ==========================================
        // 선임 캐릭터 등장 연출
        // ==========================================
        function spawnSeniorCharacter(title) {
            const board = document.getElementById('cageBoard');
            const senior = document.createElement('div');
            senior.className = 'senior-elem z-30';
            senior.style.top = '14.285%'; // Row 1 (상단에서 등장)
            senior.style.left = '42.855%'; // Col 3 (중앙 위치)

            // 선임 SVG 아이콘 (빨간 모자/관직 스타일)
            senior.innerHTML = `
                <div class="relative w-full h-full flex flex-col items-center justify-center p-1">
                    <svg viewBox="0 0 40 50" class="w-full h-full drop-shadow-lg">
                        <circle cx="20" cy="12" r="8" fill="#92400e" />
                        <circle cx="18" cy="11" r="1.5" fill="#000" />
                        <circle cx="22" cy="11" r="1.5" fill="#000" />
                        <path d="M 17 16 Q 20 13 23 16" stroke="#000" stroke-width="1.2" fill="none" />
                        <rect x="11" y="19" width="18" height="15" rx="3" fill="#991b1b" />
                        <path d="M 8 8 L 32 8 L 20 1 Z" fill="#dc2626" />
                    </svg>
                </div>
            `;

            board.appendChild(senior);

            // 선임이 한 걸음 다가옴
            setTimeout(() => {
                senior.style.top = '28.57%'; // Row 2로 이동하여 영민이에게 접근
                showSpeechBubble(`🚨 야 이 개짬찌야!! (${title}님 등판)`, senior);
            }, 300);

            // 영민이 벌벌 떠는 모션
            setTimeout(() => {
                if (charElem) charElem.style.transform = 'scale(0.85) rotate(-5deg)';
            }, 600);

            // 선임 퇴장 및 상태 복구
            setTimeout(() => {
                if (charElem) charElem.style.transform = 'scale(1) rotate(0deg)';
                senior.remove();
                isPerformingAction = false;
            }, 3500);
        }
    </script>
